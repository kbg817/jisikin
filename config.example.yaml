# ==========================================================
#  답변·댓글 센터 설정 파일
#  - 처음 실행하면 이 파일이 config.yaml 로 복사됩니다.
#  - 대시보드의 [설정] 화면에서 바로 수정할 수도 있습니다.
# ==========================================================

settings:
  interval_minutes: 10        # 자동 수집 주기(분). 0 이면 자동 수집을 끕니다.
  results_per_keyword: 50     # 검색어 하나당 가져올 최신 질문 수 (API: 최대 100, 웹: 최대 30)
  source: auto                # auto | api | web
                              #   api  : 네이버 검색 API 사용 (권장, .env 에 키 필요)
                              #   web  : 지식iN 검색 페이지를 직접 읽음 (키 불필요, 느리고 불안정)
                              #   auto : 키가 있으면 api, 없으면 web
  fetch_details: true         # 관련 질문의 상세 페이지를 열어 답변 수·작성일·내공·본문을 채웁니다.
  max_details_per_run: 40     # 한 번 수집할 때 상세 페이지를 최대 몇 개까지 열지
  request_delay_seconds: 1.0  # 네이버 요청 사이 대기 시간(초). 너무 줄이면 차단될 수 있습니다.
  max_age_days: 14            # 작성일이 이보다 오래된 질문은 목록에서 숨깁니다.
  keep_days: 60               # 이보다 오래된 미처리 질문은 DB 에서 정리합니다. (답변완료는 보관)
  port: 5000                  # 대시보드 주소: http://127.0.0.1:5000
  api_daily_limit: 20000      # 네이버 검색 API 하루 호출 상한. 무료 한도(25,000회)를 넘지 않게 막습니다.
                              # 검색어가 많으면 이 안에 들도록 수집 간격을 자동으로 늘립니다. (0 = 상한 없음, 비추천)

  # --- 상위노출 글 (제품별 exposure 검색어를 네이버에서 검색했을 때 위에 뜨는 지식iN 글)
  exposure_interval_hours: 12          # 몇 시간마다 확인할지. 0 이면 끔 (순위는 천천히 바뀌므로 12~24 권장)
  exposure_top_n: 5                    # 검색어마다 상위 몇 개까지 볼지
  exposure_sources: [pc, mobile, kin]  # pc: 통합검색(PC), mobile: 통합검색(모바일), kin: 지식iN탭 정확도순

  # --- 유튜브 · 쓰레드 (제품별 social.keywords 로 검색. [설정] > API 키에 유튜브 키 / 쓰레드 토큰이 있을 때만)
  social_interval_hours: 6    # 몇 시간마다 찾을지. 0 이면 끔
  social_max_age_days: 14     # (쓰레드) 이보다 오래된 글은 찾지 않고 할 일에서도 숨깁니다
  youtube_max_age_days: 180   # (유튜브) 이보다 오래된 영상은 찾지 않습니다. 인기 영상은 몇 달씩 추천되므로 길게
  youtube_order: relevance    # 유튜브 검색 순서: relevance(유튜브 검색 결과 순) / viewCount(조회수 순) / date(최신 순)
  youtube_results: 25         # 검색어당 영상 수 (최대 50)
  track_check_hour: 6         # [작업 결과] 매일 이 시각(한국 시간)에 내 답변·댓글이 아직 보이는지 확인. -1 이면 끔
  youtube_daily_units: 9000   # 유튜브 API 하루 사용 상한 (무료 10,000). 검색어 1개 = 약 101
                              #   하루 사용량 ≈ 검색어 수 × 101 × (24 ÷ social_interval_hours)
                              #   예) 검색어 12개, 6시간마다 → 약 4,850
  threads_results: 50         # 검색어당 쓰레드 글 수 (최대 100)

# ----------------------------------------------------------
#  AI 답변 초안 (선택) — .env 에 ANTHROPIC_API_KEY 가 있을 때만 동작
#  초안은 자동으로 등록되지 않습니다. 확인·수정 후 직접 붙여넣으세요.
#  [답변 예시] 화면에서 ⭐ 로 고른 모범 답변(제품당 5개)을 참고해 씁니다.
#  비용은 Claude Console(API) 크레딧에서 나갑니다. 이번 달 사용액은 [설정] 화면에 나옵니다.
# ----------------------------------------------------------
ai:
  model: claude-sonnet-5-5    # claude-sonnet-5-5 (기본, 초안 1건 약 $0.01~0.03) | claude-opus-5-5 (약 2배)
  effort: low                 # low | medium | high  (높을수록 느리고 비용 증가. 답변 초안은 low 로 충분)
  common_guide: |
    - 네이버 지식iN 답변 말투(존댓말, 친근하지만 전문적인 톤)로 작성합니다.
    - 질문자에게 실제로 도움이 되는 내용을 먼저, 충분히 씁니다.
    - 제품/서비스 소개는 마지막에 한두 문장으로 자연스럽게만 합니다.
      과장·반복 홍보·링크 도배는 지식iN 에서 신고·삭제될 수 있으니 피합니다.
    - 운영자(판매자)로서 소개할 때는 그 관계를 짧게 밝힙니다.
      (예: "참고로 저는 ○○를 운영하고 있어요.") — 공정위 추천·보증 심사지침
    - 500~800자 정도, 문단을 나눠 읽기 쉽게 씁니다. 마크다운 기호(#, **)는 쓰지 않습니다.
  social_guide: |             # 유튜브 댓글 · 쓰레드 답글 초안 (제품별 answer_guide 의 금지 표현도 함께 지킵니다)
    - 영상·글 내용에 대한 진심 어린 반응(공감, 구체적인 칭찬, 보충 정보)을 먼저 씁니다.
    - 제품 소개는 꼭 필요할 때만 한 문장으로 하고, 링크·가격·과장 표현은 넣지 않습니다.
    - 운영자(판매자)로서 소개할 때는 관계를 밝힙니다. (예: "○○ 운영하는 사람인데요,")
    - 2~4문장, 150자 안팎. 이모지는 많아야 1개, 해시태그는 쓰지 않습니다.

# ----------------------------------------------------------
#  제품(서비스)별 키워드 / 카테고리
#
#  keywords   : 이 단어가 들어간 질문은 관련 질문입니다. 지식iN 검색어로도 사용됩니다.
#  categories : 질문 주제 분류. 제품 키워드가 없어도 카테고리 단어가 제목에 있으면 수집됩니다.
#               - keywords : 분류용 단어 (검색은 안 함)
#               - search   : 이 카테고리 질문을 찾기 위해 추가로 검색할 검색어 (선택)
#  exclude    : 제외어. 이 표현은 가리고 판단합니다.
#               예) '사주세요' 를 넣으면 "옷 사주세요" 의 '사주' 는 무시하지만
#                   "사주 봐주세요" 는 그대로 수집됩니다.
#               앞에 ! 를 붙이면 그 단어가 있는 질문은 이 제품에서 아예 뺍니다. 예) "!주식"
#  watch_urls : 지식iN 분야 목록 페이지 주소 (선택). 예) 지식iN > 운세, 사주 분야로 가서
#               주소창의 URL 을 복사해 넣으면 그 분야의 새 질문도 함께 가져옵니다.
#  min_score  : 이 점수 이상이면 '관련 질문'으로 표시합니다.
#               (제목에 키워드 3점, 본문에 키워드 2점, 제목에 카테고리 2점, 본문에 카테고리 1점)
#  social     : [유튜브]·[쓰레드] 탭에서 검색할 말. 브랜드명(언급 찾기)과, 댓글 달 만한 주제 영상을 찾을 말을 넣으세요.
#               - keywords : 예) [닥사렌, 모공각화증]. 비워두면 제품 이름으로 검색합니다.
#               여기 넣은 말은 유튜브·쓰레드 글을 분류할 때 제품 키워드로도 칩니다.
#               검색어가 많을수록 유튜브 할당량을 많이 씁니다 (검색어 1개 ≈ 101, 하루 무료 10,000).
#  exposure   : [상위노출 글] 탭에서 확인할 검색어. 사람들이 네이버에 실제로 칠 만한 말로 넣으세요.
#               - seeds        : 메인 키워드 기본값 (예: [건선]). [검색어 관리]에서 세부 검색어를 자동으로 만드는 데 쓰며,
#                                그 화면에서 바꾸면 화면 값이 우선합니다.
#               - keywords     : 그대로 검색할 말 (예: 건선 크림 추천)
#               - regions × region_terms : 지역 × 단어 조합을 자동으로 만듭니다.
#                 예) regions [인천, 부천] × region_terms [건선, 건선 피부과]
#                     → 인천 건선, 인천 건선 피부과, 부천 건선, 부천 건선 피부과
#               검색어가 많을수록 확인이 오래 걸립니다. (검색어 1개 ≈ 네이버 요청 3~5번)
#               ※ 메인 키워드(예: 건선)만 넣고 세부 검색어를 자동으로 만들려면
#                  대시보드 [검색어 관리] 화면을 쓰세요. (지역 조합에는 여기 regions 가 쓰입니다)
#
#  띄어쓰기 규칙: 키워드에 넣은 띄어쓰기는 있어도/없어도 찾습니다.
#      "키 크는 법" → '키크는법', '키 크는법', '키 크는 법' 모두 찾음
#      "건선"       → '건선' 만 찾음 ('조건 선택' 같은 오탐 방지)
#  정규식이 필요하면 앞에 re: 를 붙이세요. 예) "re:사주(?!세요|줘)"
# ----------------------------------------------------------
products:
  - id: sinui
    name: 신의소리
    url: ""                   # 사이트 주소 (AI 초안에 참고용)
    color: "#7c3aed"
    min_score: 2
    keywords: [신점, 타로, 사주, 운세, 궁합, 점집, 철학관, 역술, 무당, 신내림, 팔자, 신년 운세, 토정비결]
    exclude: [사주세요, 사줘, 사줬, 사주고 싶, 사주면, 사주실, 사주는데, 사주신, 사줄, 사주기로, 사주려고, 사주더라]
    categories:
      - name: 재회운
        keywords: [재회, 재결합, 헤어진, 전 남친, 전 여친, 전 남자친구, 전 여자친구, 다시 만날, 연락 올까, 연락이 올까, 돌아올까, 이별]
        search: [재회운, 재회 가능성, 전남친 연락 올까요]
      - name: 연애운
        keywords: [연애운, 짝사랑, 속마음, 썸남, 썸녀, 인연, 애정운, 이성운, 연애 언제]
        search: [연애운, 짝사랑 속마음]
      - name: 결혼·궁합
        keywords: [결혼운, 결혼 시기, 배우자운, 궁합, 남편복, 아내복]
        search: [결혼운, 궁합 봐주세요]
      - name: 사업운
        keywords: [사업운, 창업운, 개업운, 장사운, 개업 날짜, 개업일, 택일]
        search: [사업운]
      - name: 금전·재물운
        keywords: [금전운, 재물운, 돈복, 재운]
        search: [재물운]
      - name: 직장·시험운
        keywords: [직장운, 이직운, 취업운, 합격운, 시험운, 승진운, 관운]
        search: [취업운, 이직운]
      - name: 건강·가족운
        keywords: [건강운, 자식운, 부모운, 가족운]
      - name: 점집·상담 추천
        keywords: [점집 추천, 신점 추천, 타로 추천, 잘 보는 곳, 잘 보는 집, 용한 곳, 용한 점집, 전화 상담, 전화 타로, 전화 신점]
        search: [신점 잘보는곳, 타로 잘보는곳, 사주 잘보는곳]
      - name: 꿈해몽
        keywords: [꿈해몽, 태몽, 꿈 풀이, 꿈을 꿨]
    watch_urls: []
    exposure:
      seeds: [신점, 타로, 사주, 재회운]
      keywords: [신점 잘보는곳, 타로 잘보는곳, 사주 잘보는곳, 재회운 잘보는곳, 전화 신점 추천, 궁합 잘보는곳]
      regions: [서울, 인천, 부산, 대구]
      region_terms: [신점, 점집]
    social:
      keywords: [신의소리, 신점 후기, 전화 타로]
    answer_guide: |
      신의소리는 신점·타로·사주 상담 사이트입니다.
      질문자의 고민에 먼저 공감하고, 질문에 정보(생년월일, 상황 등)가 있으면 일반적인 해석 방향을
      짧게 제시한 뒤, 더 자세한 상담이 필요하면 신의소리에서 상담받을 수 있다고 안내합니다.
      결과를 단정하거나 불안감을 조성하지 않습니다. ("반드시 ~된다", "굿을 해야 한다" 등 금지)

  - id: myeongun
    name: 명운연구소
    url: ""
    color: "#d97706"
    min_score: 2
    keywords: [작명, 작명소, 개명, 아기 이름, 신생아 이름, 이름 짓기, 이름 지어, 이름 풀이, 이름 추천, 성명학, 상호명 추천, 가게 이름 추천]
    exclude: [닉네임, 게임 이름, 캐릭터 이름, 주인공 이름, 등장인물 이름, 길드 이름, 강아지 이름, 고양이 이름, 반려동물 이름, 반려견 이름,
              햄스터 이름, 영어 이름, 영어이름, 팀 이름, 채널 이름, 채널명, 와이파이 이름, 계정 이름, 파일 이름, 폴더 이름]
    categories:
      - name: 아기 작명
        keywords: [아기 이름, 신생아 이름, 아들 이름, 딸 이름, 돌림자, 항렬자, 쌍둥이 이름, 태어날 아기 이름]
        search: [아기 이름 추천]
      - name: 개명
        keywords: [개명, 이름을 바꾸, 이름 바꾸, 이름 변경, 개명하고 싶]
      - name: 이름 풀이·성명학
        keywords: [이름 풀이, 성명학, 이름 뜻, 이름 획수, 수리 성명, 발음 오행, 자원 오행, 이름이 안 좋, 이름 좋은지, 이름 사주]
      - name: 한자 이름
        keywords: [한자 이름, 이름 한자, 인명용 한자]
        search: [이름 한자 추천]
      - name: 상호·브랜드 작명
        keywords: [상호명 추천, 상호명 짓, 상호명 지어, 상호 작명, 가게 이름 추천, 가게 이름 짓, 가게 이름 지어, 회사 이름 추천, 회사명 추천,
                   브랜드 이름 추천, 브랜드명 추천, 법인명 추천]
      - name: 작명소 추천
        keywords: [작명소, 작명원, 작명 잘하는, 작명 추천, 작명 비용, 작명 가격, 온라인 작명, 인터넷 작명]
    watch_urls: []
    exposure:
      seeds: [작명, 개명, 아기 이름, 이름 풀이]
      keywords: [작명소 추천, 아기 이름 추천, 개명 이름 추천, 이름 풀이, 신생아 작명, 개명 신청 방법]
      regions: [서울, 인천, 부산, 대구]
      region_terms: [작명소]
    social:
      keywords: [명운연구소, 아기 이름 짓기, 개명 후기]
    answer_guide: |
      명운연구소는 온라인 작명·개명 서비스(온라인 작명소)입니다.
      질문자의 상황(아기 출생, 개명 이유, 상호·브랜드 등)에 맞춰 이름 짓기의 기본 원칙
      (부르기 쉬운 발음, 좋은 뜻, 한자 획수·오행, 대법원 인명용 한자 여부, 집안 돌림자)을 먼저 설명합니다.
      개명 질문이면 법원 개명 허가 신청 절차를 간단히 안내합니다.
      더 정확한 작명이 필요하면 명운연구소에서 상담받을 수 있다고 자연스럽게 소개합니다.
      특정 이름이 "나쁘다", "불행해진다"처럼 불안을 조성하는 표현은 쓰지 않습니다.

