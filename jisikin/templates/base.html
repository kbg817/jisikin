<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}지식iN 질문 수집기{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303c75a'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <h1><a href="/">지식iN 질문 수집기</a></h1>
  <div class="run-status" id="run-status">{% block status %}{% endblock %}</div>
  {% block actions %}{% endblock %}
  {% if user.role == "admin" %}
  <a class="btn {% if request.endpoint == 'keywords_page' %}current{% endif %}" href="/keywords">검색어 관리</a>
  <a class="btn {% if request.endpoint == 'examples_page' %}current{% endif %}" href="/examples">답변 예시</a>
  <a class="btn {% if request.endpoint == 'settings' %}current{% endif %}" href="/settings">설정</a>
  {% endif %}
  {% if auth_on and user.username %}
  <form method="post" action="/logout" class="me">
    <span title="{{ user.username }}">{{ user.name }}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn small" type="submit">로그아웃</button>
  </form>
  {% endif %}
</header>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
