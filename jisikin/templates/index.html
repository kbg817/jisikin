{% extends "base.html" %}
{% block status %}불러오는 중…{% endblock %}
{% block body %}
<div class="wrap">
  <nav class="views" id="views">
    <button class="view active" data-group="kin"><span class="pf kin">N</span>지식iN <span class="cnt" id="cnt-kin"></span></button>
    <button class="view" data-group="youtube"><span class="pf yt">▶</span>유튜브 <span class="cnt" id="cnt-youtube"></span></button>
    <button class="view" data-group="threads"><span class="pf th">@</span>쓰레드 <span class="cnt" id="cnt-threads"></span></button>
    <button class="view results-tab" data-group="results"><span class="pf rs">✓</span>작업 결과 <span class="cnt warn" id="cnt-results"></span></button>
  </nav>
  <nav class="subviews" id="subviews">
    <button class="subview active" data-view="feed">새 질문 <span class="muted">실시간으로 올라온 질문</span></button>
    <button class="subview" data-view="exposure">상위노출 글 <span class="muted">검색 상위에 뜨는 글</span></button>
  </nav>
  <nav class="tabs" id="tabs"></nav>
  <div class="chips" id="chips"></div>

  <div class="toolbar" id="exp-toolbar" hidden>
    <span class="exp-status" id="exp-status"></span>
    <label title="답변완료/제외한 글 숨기기"><input type="checkbox" id="x-unanswered"> 처리 안 한 글만</label>
    <button class="btn primary small" id="exp-check-btn" type="button">지금 확인</button>
  </div>

  <div class="toolbar" id="social-toolbar" hidden>
    <span class="exp-status" id="social-status"></span>
    <select id="s-status" title="상태">
      <option value="todo">할 일</option>
      <option value="answered">댓글완료</option>
      <option value="skipped">제외함</option>
      <option value="all">전체</option>
    </select>
    <select id="s-sort" title="정렬"></select>
    <select id="s-kind" title="영상 종류">
      <option value="">일반 영상 + 숏츠</option>
      <option value="exclude">일반 영상만</option>
      <option value="only">숏츠만</option>
    </select>
    <label title="제품 키워드 점수가 min_score 미만인 글도 표시 (검색어 튜닝용)"><input type="checkbox" id="s-low"> 관련도 낮은 글도</label>
    <input type="search" id="s-q" placeholder="제목·내용·작성자 검색">
    <button class="btn primary small" id="social-collect-btn" type="button">지금 찾기</button>
  </div>

  <div class="toolbar" id="results-toolbar" hidden>
    <span class="exp-status" id="results-status"></span>
    <select id="r-platform" title="어디에 단 답변·댓글">
      <option value="">지식iN + 유튜브 + 쓰레드</option>
      <option value="kin">지식iN</option>
      <option value="youtube">유튜브</option>
      <option value="threads">쓰레드</option>
    </select>
    <select id="r-state" title="확인 결과">
      <option value="">모든 결과</option>
      <option value="visible">✅ 노출 중</option>
      <option value="problem">⚠️ 안 보임·삭제</option>
      <option value="unknown">확인 전·확인 불가</option>
    </select>
    <select id="r-by" title="작업한 사람" hidden></select>
    <button class="btn primary small" id="results-check-btn" type="button">지금 확인</button>
  </div>

  <div class="toolbar" id="feed-toolbar">
    <span class="exp-status" id="feed-status"></span>
    <select id="f-status" title="상태">
      <option value="todo">할 일</option>
      <option value="answered">답변완료</option>
      <option value="skipped">제외함</option>
      <option value="all">전체</option>
    </select>
    <select id="f-sort" title="정렬">
      <option value="priority">추천순</option>
      <option value="latest">최신순</option>
    </select>
    <label title="답변이 아직 없는 질문(답변 수를 모르는 질문 포함)"><input type="checkbox" id="f-unanswered"> 답변 없는 질문만</label>
    <label title="점수가 min_score 미만인 질문도 표시 (키워드 튜닝용)"><input type="checkbox" id="f-low"> 관련도 낮은 질문도</label>
    <input type="search" id="f-q" placeholder="제목·본문 검색">
    <button class="btn primary small" id="collect-btn" type="button">지금 수집</button>
  </div>

  <div id="notice"></div>
  <main id="list"></main>
</div>

<div class="toast" id="toast"></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}
